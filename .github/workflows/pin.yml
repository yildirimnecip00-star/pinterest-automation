name: Pinterest pin automation

on:
  schedule:
    # Her gun ~09:00 UTC (Turkiye ~12:00). Saati degistirmek istersen cron'u guncelle.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Bu calismada atilacak en fazla pin sayisi"
        required: false
        default: "30"

concurrency:
  group: pinterest-pin-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Pin at
        env:
          CI: "true"
          PER_RUN_LIMIT: ${{ github.event.inputs.limit || '30' }}
          MAX_PINS_PER_DAY: "30"
          PIN_DELAY_SECONDS: "8"
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_BOARD_NAME: ${{ vars.PINTEREST_BOARD_NAME || 'Anatolian Kilim Home' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ETSY_SHOP_NAME: ${{ vars.ETSY_SHOP_NAME || 'AnatolianKilimHome' }}
          IMAGE_VARIANT: ${{ vars.IMAGE_VARIANT || 'postcard' }}
        run: node src/index.js

      - name: Durum dosyasini isle (data/state.json)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/state.json
          if git diff --cached --quiet; then
            echo "state.json degismedi, commit yok."
          else
            git commit -m "chore: pin durumu guncellendi ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
