name: Pinterest OAuth (tek seferlik)

# Bu workflow'u ELLE calistir (Actions sekmesi -> "Run workflow"):
#   1. 'code' alanini BOS birak -> loglarda yetkilendirme URL'si cikar.
#   2. URL'yi ac, izin ver, adres cubugundaki ?code=... degerini kopyala.
#   3. Workflow'u tekrar calistir, 'code' alanina yapistir -> loglarda
#      PINTEREST_REFRESH_TOKEN ve pano listesi cikar.
#   4. refresh_token'i repo Settings -> Secrets -> Actions'a PINTEREST_REFRESH_TOKEN
#      olarak ekle. Pano id'yi istersen PINTEREST_BOARD_ID olarak ekle.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Pinterest'ten donen ?code=... degeri (ilk calistirmada BOS birak)"
        required: false
        default: ""

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          CI: "true"
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REDIRECT_URI: ${{ vars.PINTEREST_REDIRECT_URI || 'https://localhost/callback' }}
          PINTEREST_AUTH_CODE: ${{ github.event.inputs.code }}
        run: node scripts/pinterest-auth.js
